name: Avisos de Registre Horari
on:
  # 18:00 UTC = 20:00 a Catalunya a l'estiu; 19:00 UTC = 20:00 a l'hivern.
  # El codi comprova Europe/Madrid i només envia en la franja local de les 20 h.
  schedule:
    - cron: '0 18,19 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: avisos-registre-horari
  cancel-in-progress: false
jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Firebase Admin
        run: npm install --no-save firebase-admin
      - name: Send tomorrow reminders
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node <<'NODE'
          const admin = require('firebase-admin');

          async function main() {
            const raw = process.env.FIREBASE_SERVICE_ACCOUNT;
            if (!raw) throw new Error('Falta el secret FIREBASE_SERVICE_ACCOUNT.');
            const key = JSON.parse(raw);
            if (!key.project_id || !key.private_key || !key.client_email) {
              throw new Error('El secret FIREBASE_SERVICE_ACCOUNT no conté un JSON de compte de servei vàlid.');
            }

            // Només executem l'enviament quan són les 20 h a Catalunya,
            // independentment de l'horari d'estiu/hivern.
            const now = new Date();
            const parts = new Intl.DateTimeFormat('en-GB', {
              timeZone: 'Europe/Madrid',
              year: 'numeric', month: '2-digit', day: '2-digit',
              hour: '2-digit', hourCycle: 'h23'
            }).formatToParts(now);
            const part = type => parts.find(x => x.type === type)?.value;
            const hour = Number(part('hour'));
            if (hour !== 20) {
              console.log('Execució de control: ara no són les 20 h a Europe/Madrid. No s’envia res.');
              return;
            }

            // Calculem demà a partir del calendari local, sense sumar 24 hores
            // (així no falla els dies de canvi d'horari).
            const tomorrow = new Date(Date.UTC(
              Number(part('year')), Number(part('month')) - 1, Number(part('day')) + 1
            ));
            const y = tomorrow.getUTCFullYear();
            const m = String(tomorrow.getUTCMonth() + 1).padStart(2, '0');
            const d = String(tomorrow.getUTCDate()).padStart(2, '0');
            const dateKey = `${y}-${m}-${d}`;
            const niceDate = new Intl.DateTimeFormat('ca-ES', {
              timeZone: 'Europe/Madrid', weekday: 'long', day: 'numeric', month: 'long'
            }).format(new Date(Date.UTC(y, tomorrow.getUTCMonth(), tomorrow.getUTCDate(), 12)));

            admin.initializeApp({ credential: admin.credential.cert(key) });
            const db = admin.firestore();
            const messaging = admin.messaging();
            const users = await db.collection('usuaris').get();
            let sent = 0, skipped = 0, failed = 0;

            for (const user of users.docs) {
              try {
                const base = user.ref.collection('dades');
                const [stateSnap, pushSnap] = await Promise.all([
                  base.doc('estat').get(),
                  base.doc('push').get()
                ]);
                if (!stateSnap.exists || !pushSnap.exists) { skipped++; continue; }

                const rawState = stateSnap.data().json;
                const state = typeof rawState === 'string' ? JSON.parse(rawState) : (rawState || {});
                const record = state.registres?.[dateKey];
                const icon = record?.noteIcon;
                const tokens = [...new Set(pushSnap.data().tokens || [])].filter(Boolean);
                if (!icon || !tokens.length) { skipped++; continue; }

                const shown = icon === 'red_plus' ? '➕' : String(icon);
                const message = {
                  notification: {
                    title: 'Recordatori per demà',
                    body: shown + ' Tens una data programada: ' + niceDate + '.'
                  },
                  data: { date: dateKey, tag: 'rh-' + dateKey },
                  webpush: {
                    notification: {
                      icon: 'https://cathalmcdonegal.github.io/Registre-Horari/app-icon.png',
                      tag: 'rh-' + dateKey
                    },
                    fcmOptions: { link: 'https://cathalmcdonegal.github.io/Registre-Horari/' }
                  }
                };

                // FCM accepta fins a 500 tokens per enviament.
                for (let i = 0; i < tokens.length; i += 500) {
                  const batch = tokens.slice(i, i + 500);
                  const response = await messaging.sendEachForMulticast({ ...message, tokens: batch });
                  sent += response.successCount;
                  failed += response.failureCount;
                  response.responses.forEach((result, index) => {
                    if (!result.success) {
                      console.log('FCM token amb error per usuari ' + user.id + ': ' + (result.error?.code || 'error desconegut'));
                    }
                  });
                }
              } catch (error) {
                failed++;
                console.error('Error processant usuari ' + user.id + ':', error.message || error);
              }
            }

            console.log('Data objectiu: ' + dateKey);
            console.log('Notificacions enviades: ' + sent);
            console.log('Registres omesos (sense icona o dispositiu): ' + skipped);
            console.log('Errors: ' + failed);
          }

          main().catch(error => { console.error(error); process.exit(1); });
          NODE
