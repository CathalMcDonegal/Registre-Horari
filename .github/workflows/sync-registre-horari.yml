name: Sync Registre Horari index
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 18,19 * * *'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          if 'firebase-config.js' not in s: s=s.replace('<link rel="manifest" href="manifest.json">','<link rel="manifest" href="manifest.json">\n<script src="firebase-config.js"></script>',1)
          s=s.replace('<title>Registre Horari 2.0</title>','<title>Registre Horari 2.3</title>',1)
          if '#lockScreen' not in s: s=s.replace('</style>','''#lockScreen{position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#0f172a 0%,#1e3a5f 100%);display:flex;align-items:center;justify-content:center;padding:24px}#lockScreen.hidden{display:none}.lock-box{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:28px 24px;width:100%;max-width:340px;text-align:center}.lock-box h2{margin:0 0 6px;color:#f1f5f9}.lock-box p{margin:0 0 18px;color:#94a3b8}.lock-box input{width:100%;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(15,23,42,.6);color:#f8fafc;text-align:center;margin-bottom:12px}.lock-box button{width:100%;padding:13px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:700}.lock-error{color:#fca5a5;font-size:.78rem;min-height:1.2em;margin:8px 0}.lock-box button.lock-sec{margin-top:10px;background:transparent;border:1px solid rgba(255,255,255,.3);color:#e2e8f0}.lock-box button.lock-link{margin-top:8px;background:none;color:#93c5fd;font-size:.8rem}.lock-wm{margin-top:18px;font-size:.7rem;color:#64748b}'''+'''</style>''',1)
          if 'id="lockScreen"' not in s: s=s.replace('<body>','''<body><div id="lockScreen" role="dialog" aria-modal="true"><div class="lock-box"><h2>Registre Horari</h2><p id="lockSub">Introdueix la contrasenya per continuar</p><form onsubmit="return tryUnlock(event)"><input type="email" id="lockEmail" placeholder="Correu electrònic" style="display:none"><input type="password" id="lockInput" inputmode="numeric" placeholder="••••" maxlength="64"><button type="submit">Entrar</button><button type="button" id="lockRegister" class="lock-sec" style="display:none" onclick="RHSync.register()">Crear compte nou</button><button type="button" id="lockReset" class="lock-link" style="display:none" onclick="RHSync.reset()">Has oblidat la contrasenya?</button><div class="lock-error" id="lockError"></div></form><div class="lock-wm">Ús exclusiu TIP 22953</div></div></div>''',1)
          if 'function authConfigured()' not in s:
              js='''<script>const APP_PASSWORD="1312",UNLOCK_KEY="registreHorariMossos.unlock";function authConfigured(){const c=window.FIREBASE_CONFIG;return !!(c&&c.apiKey&&!/^PEGA/.test(c.apiKey))}function isUnlocked(){try{return sessionStorage.getItem(UNLOCK_KEY)==="1"}catch(e){return false}}function setUnlocked(){try{sessionStorage.setItem(UNLOCK_KEY,"1")}catch(e){}}function tryUnlock(e){if(e)e.preventDefault();if(authConfigured()){window.RHSync&&RHSync.login();return false}const i=document.getElementById("lockInput"),x=document.getElementById("lockError");if((i?.value||"").trim()===APP_PASSWORD){setUnlocked();document.getElementById("lockScreen").classList.add("hidden");i.value="";x.textContent=""}else{x.textContent="Contrasenya incorrecta";i.value="";i.focus()}return false}function enforceLock(){const s=document.getElementById("lockScreen");if(!s)return;if(authConfigured()){lockEmail.style.display="";lockRegister.style.display="";lockReset.style.display="";lockInput.removeAttribute("inputmode");lockInput.placeholder="Contrasenya";lockSub.textContent="Inicia sessió o crea el teu compte";s.classList.remove("hidden")}else if(isUnlocked())s.classList.add("hidden");else{s.classList.remove("hidden");setTimeout(()=>lockInput.focus(),80)}}enforceLock();function applyRemoteState(raw){state=migrate(raw);const p=JSON.stringify(state);localStorage.setItem(KEY,p);localStorage.setItem(KEY+".latest",p);window.__lastContent=null;renderAll()}</script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="sync.js"></script>'''; s=s.replace('</body>',js+'</body>',1)
          p.write_text(s)
          PY
      - name: Commit patched index
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Update Registre Horari index to v2.3"
          git push


  notifications:
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[test-notificacions]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Firebase Admin
        run: npm install --no-save firebase-admin
      - name: Send notification
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node <<'NODE'
          const admin = require('firebase-admin');

          async function main() {
            const raw = process.env.FIREBASE_SERVICE_ACCOUNT;
            if (!raw) throw new Error('Falta el secret FIREBASE_SERVICE_ACCOUNT.');
            const key = JSON.parse(raw);
            admin.initializeApp({ credential: admin.credential.cert(key) });
            const db = admin.firestore();
            const messaging = admin.messaging();
            const users = await db.collection('usuaris').get();
            let sent = 0, skipped = 0, failed = 0;

            const testMode = process.env.EVENT_NAME === 'push';
            let dateKey = '';
            let niceDate = '';

            if (!testMode) {
              const now = new Date();
              const parts = new Intl.DateTimeFormat('en-GB', {
                timeZone: 'Europe/Madrid', year: 'numeric', month: '2-digit',
                day: '2-digit', hour: '2-digit', hourCycle: 'h23'
              }).formatToParts(now);
              const part = type => parts.find(x => x.type === type)?.value;
              if (Number(part('hour')) !== 20) {
                console.log('Control horari: encara no són les 20 h a Catalunya; no s’envia cap avís.');
                return;
              }
              const tomorrow = new Date(Date.UTC(
                Number(part('year')), Number(part('month')) - 1, Number(part('day')) + 1
              ));
              const y = tomorrow.getUTCFullYear();
              const m = String(tomorrow.getUTCMonth() + 1).padStart(2, '0');
              const d = String(tomorrow.getUTCDate()).padStart(2, '0');
              dateKey = `${y}-${m}-${d}`;
              niceDate = new Intl.DateTimeFormat('ca-ES', {
                timeZone: 'Europe/Madrid', weekday: 'long', day: 'numeric', month: 'long'
              }).format(new Date(Date.UTC(y, tomorrow.getUTCMonth(), tomorrow.getUTCDate(), 12)));
            }

            for (const user of users.docs) {
              try {
                const base = user.ref.collection('dades');
                const [stateSnap, pushSnap] = await Promise.all([
                  base.doc('estat').get(), base.doc('push').get()
                ]);
                if (!pushSnap.exists) { skipped++; continue; }
                const tokens = [...new Set(pushSnap.data().tokens || [])].filter(Boolean);
                if (!tokens.length) { skipped++; continue; }

                let body;
                if (testMode) {
                  body = 'Aquesta és una notificació de prova. Les notificacions del calendari ja estan connectades.';
                } else {
                  if (!stateSnap.exists) { skipped++; continue; }
                  const rawState = stateSnap.data().json;
                  const state = typeof rawState === 'string' ? JSON.parse(rawState) : (rawState || {});
                  const record = state.registres?.[dateKey];
                  const icon = record?.noteIcon;
                  if (!icon) { skipped++; continue; }
                  const shown = icon === 'red_plus' ? '➕' : String(icon);
                  body = shown + ' Tens una data programada: ' + niceDate + '.';
                }

                const message = {
                  notification: {
                    title: testMode ? 'Prova de notificacions · Registre Horari' : 'Recordatori per demà',
                    body
                  },
                  data: { date: dateKey, tag: testMode ? 'rh-test-' + Date.now() : 'rh-' + dateKey },
                  webpush: {
                    notification: {
                      icon: 'https://cathalmcdonegal.github.io/Registre-Horari/app-icon.png',
                      tag: testMode ? 'rh-test-' + Date.now() : 'rh-' + dateKey
                    },
                    fcmOptions: { link: 'https://cathalmcdonegal.github.io/Registre-Horari/' }
                  }
                };

                for (let i = 0; i < tokens.length; i += 500) {
                  const response = await messaging.sendEachForMulticast({
                    ...message, tokens: tokens.slice(i, i + 500)
                  });
                  sent += response.successCount;
                  failed += response.failureCount;
                  response.responses.forEach(result => {
                    if (!result.success) console.log('Error FCM:', result.error?.code || result.error?.message || 'desconegut');
                  });
                }
              } catch (error) {
                failed++;
                console.error('Error processant usuari ' + user.id + ':', error.message || error);
              }
            }
            console.log('Mode: ' + (testMode ? 'prova' : 'recordatoris'));
            console.log('Data objectiu: ' + (dateKey || 'prova'));
            console.log('Notificacions enviades: ' + sent);
            console.log('Dispositius omesos: ' + skipped);
            console.log('Errors: ' + failed);
          }

          main().catch(error => { console.error(error); process.exit(1); });
          NODE
